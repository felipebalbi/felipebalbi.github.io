{% extends "base.html" %}

{% block title %}{{ section.title }} &middot; {{ config.title }}{% endblock %}

{% block content %}
<h1>{{ section.title }}</h1>
{% if section.content %}<div>{{ section.content | safe }}</div>{% endif %}

<ul class="post-list" style="margin-top:2rem">
  {% for page in section.pages %}
    {{<post_entry page={page} />}}
  {% endfor %}
</ul>
{% endblock %}
